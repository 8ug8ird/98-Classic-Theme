
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate theme CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Stylelint
        run: npm install --no-save stylelint stylelint-config-standard

      
      - name: Create Stylelint config
        run: |
          printf '%s\n' \
            '{"rules":{"at-rule-no-unknown":true,"block-no-empty":true,"declaration-block-no-duplicate-properties":true,"property-no-unknown":true,"selector-pseudo-class-no-unknown":true,"selector-pseudo-element-no-unknown":true}}' \
            > .stylelintrc.json

      - name: Validate CSS
        run: npx stylelint Classic98.css Classic98.theme.css
